<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="calculator">
        <div id="display">
            <div id="screen"></div>
        </div>
        <div id="buttons">
            <div id="container1">
                <div class="numbers">
                    <div class="numbered-buttons">7</div>
                    <div class="numbered-buttons">8</div>
                    <div class="numbered-buttons">9</div>
                    <div class="numbered-buttons">4</div>
                    <div class="numbered-buttons">5</div>
                    <div class="numbered-buttons">6</div>
                    <div class="numbered-buttons">1</div>
                    <div class="numbered-buttons">2</div>
                    <div class="numbered-buttons">3</div>
                </div>
                <div id="buttons-below">
                    <div id="button-AC">AC</div>
                    <div class="numbered-buttons">0</div>
                    <div id="button-equal">=</div>
                </div>
            </div>    
            <div id="container2">
                <div class="operator">÷</div>
                <div class="operator">x</div>
                <div class="operator">-</div>
                <div class="operator">+</div>
            </div>
        </div>
    </div>
    
    
</body>
</html>
