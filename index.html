<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="calculator">
        <div id="display">
            <div id="screen"></div>
        </div>
        <div id="buttons">
            <div id="container1">
                <div class="numbers">
                    <div id="button7">7</div>
                    <div id="button8">8</div>
                    <div id="button9">9</div>
                    <div id="button4">4</div>
                    <div id="button5">5</div>
                    <div id="button6">6</div>
                    <div id="button1">1</div>
                    <div id="button2">2</div>
                    <div id="button3">3</div>
                </div>
                <div id="buttons-below">
                    <div id="buttonAC">AC</div>
                    <div id="button0">0</div>
                    <div id="buttonEqual">=</div>
                </div>
            </div>    
            <div id="container2">
                <div id="buttonDivide">÷</div>
                <div id="buttonMultiply">x</div>
                <div id="buttonMinus">-</div>
                <div id="buttonAdd">+</div>
            </div>
        </div>
    </div>
    
    
</body>
</html>
